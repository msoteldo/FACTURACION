<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Portal simulado de facturación</title></head>
<body>
<!-- Simula los ids/names y el comportamiento SPA del portal real de Walmart
     (solo para pruebas; no es una copia del portal). -->
<div id="app"></div>
<script>
const estado = { rfc: "", captcha: false };
const app = document.getElementById("app");

// Con estado.sinRutas la SPA cambia de pantalla SIN cambiar la URL (como se vio en el
// portal real, donde la pantalla de datos fiscales no estaba en /address).
function ir(ruta) {
  if (estado.sinRutas) estado.vista = ruta; else history.pushState({}, "", ruta);
  setTimeout(render, 300);
}

function modal(texto, alContinuar) {
  const m = document.createElement("div");
  m.setAttribute("role", "dialog");
  m.innerHTML = `<p>${texto}</p>
    <button id="dynamic_modal_primary_btn">Continuar</button>
    <button id="dynamic_modal_secondary_btn">Cerrar</button>`;
  document.body.appendChild(m);
  m.querySelector("#dynamic_modal_primary_btn").onclick = () => { m.remove(); alContinuar(); };
  m.querySelector("#dynamic_modal_secondary_btn").onclick = () => m.remove();
}

function descargar(nombre, contenido, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
}

function renderConsulta() {
  app.innerHTML = `
    <b>Consultar por Número de Ticket</b>
    <input name="numeroDeTicketoFactura" placeholder="Número de Ticket o factura">
    <button id="form_btn_cancel">Cancelar</button>
    <button id="form_btn_accept">Continuar</button>`;
  document.getElementById("form_btn_accept").onclick = () => {
    const n = document.querySelector("[name=numeroDeTicketoFactura]").value;
    if (n.startsWith("000")) { estado.error = "El ticket no se encuentra facturado o no existe"; ir("/formError"); return; }
    app.innerHTML = `<p>Factura encontrada: folio ABC123</p>
      <button id="btn_xml">Descargar XML</button>
      <button id="btn_pdf">Descargar PDF</button>
      <button id="btn_reenviar">Reenviar por correo</button>`;
    document.getElementById("btn_xml").onclick = () => descargar("consulta.xml", "<cfdi:Comprobante/>", "application/xml");
    document.getElementById("btn_pdf").onclick = () => descargar("consulta.pdf", "%PDF-1.4", "application/pdf");
    document.getElementById("btn_reenviar").onclick = () => { window.__reenviado = 1; document.title = "REENVIADO"; };
  };
}

function render() {
  const ruta = estado.vista || location.pathname;
  if (ruta === "/formError") {  // así responde el portal real a un ticket no válido
    app.innerHTML = `<div id="error_container"><p>${estado.error}</p>
      <button id="error_btn_accept" type="submit">Aceptar</button></div>`;
    return;
  }
  if (ruta === "/ticket") {
    app.innerHTML = `
      <button id="obtener_factura_button">Obtener factura</button>
      <button id="invoice_tab_facturar">Facturar</button>
      <button id="invoice_tab_consulta">Consulta o reenvía tu factura</button>
      <input name="membershipOrRFC"><input name="postalCode">
      <input name="ticketNumber"><input name="transactionNumber">
      <button id="form_btn_accept">Continuar</button>`;
    // Como en el portal real: el aviso aparece un momento DESPUÉS de cargar y su overlay
    // cubre toda la página (intercepta los clics) hasta que se acepta; luego se desvanece.
    if (!window.__avisoMostrado) setTimeout(() => {
      window.__avisoMostrado = true;
      const o = document.createElement("div");
      o.id = "popup_overlay";
      o.style = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000";
      o.innerHTML = '<div style="background:#fff;margin:100px auto;width:300px"><p>Aviso</p>' +
                    '<button id="popup_btn_accept">Aceptar</button></div>';
      document.body.appendChild(o);
      o.querySelector("#popup_btn_accept").onclick = () => {
        o.style.opacity = ".5"; setTimeout(() => o.remove(), 400);
      };
    }, 2500);
    document.getElementById("invoice_tab_consulta").onclick = renderConsulta;
    document.getElementById("form_btn_accept").onclick = () => {
      const tc = document.querySelector("[name=ticketNumber]").value;
      if (tc.startsWith("999") && !estado.captcha) {
        estado.captcha = true;
        const f = document.createElement("iframe");
        f.title = "reCAPTCHA challenge"; f.width = 300; f.height = 100;
        document.body.appendChild(f);
        return;
      }
      if (tc.startsWith("000")) { estado.error = "Ticket ya facturado"; ir("/formError"); return; }
      estado.rfc = document.querySelector("[name=membershipOrRFC]").value;
      estado.sinRutas = tc.startsWith("88");
      ir("/address");
    };
  } else if (ruta === "/address") {
    app.innerHTML = `
      <input name="rfc" disabled value="${estado.rfc}">
      <input name="Razón Social"><input name="Calle"><input name="Número exterior">
      <input name="Número interior"><input name="Referencia"><input name="Estado">
      <input name="Municipio/Delegación"><input name="Colonia"><input name="Código Postal">
      <input name="email">
      <select name="Régimen Fiscal"><option value="">Selecciona</option>
        <option value="612">612 - Personas Físicas con Actividades Empresariales</option>
        <option value="601">601 - General de Ley Personas Morales</option></select>
      <select name="Uso Factura"><option value="">Selecciona</option></select>
      <button id="form_btn_accept">Aceptar</button>`;
    document.querySelector("[name='Régimen Fiscal']").onchange = () => setTimeout(() => {
      document.querySelector("[name='Uso Factura']").innerHTML = `<option value="">Selecciona</option>
        <option value="G01">G01 - Adquisición de mercancías</option>
        <option value="G03">G03 - Gastos en general</option>`;
    }, 400);
    // Simula que el portal reescribe la razón social tal como está en el SAT.
    document.querySelector("[name='Razón Social']").oninput = (e) => {
      if (e.target.value.endsWith("SA DE CV")) setTimeout(() => e.target.value = e.target.value.replace("SA DE CV", "S.A. DE C.V."), 200);
    };
    document.getElementById("form_btn_accept").onclick = () =>
      modal("¿Confirmas que tus datos fiscales son correctos?", () => ir("/payment"));
    // Aviso "Importante" con retraso y un botón cuyo id no conocemos.
    setTimeout(() => {
      const o = document.createElement("div");
      o.id = "popup_overlay";
      o.style = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000";
      o.innerHTML = '<div><p>Importante: será necesario capturar nuevamente su información fiscal.</p>' +
                    '<button class="btn-aviso">Aceptar</button></div>';
      document.body.appendChild(o);
      o.querySelector("button").onclick = () => o.remove();
    }, 1000);
  } else if (ruta === "/payment") {
    app.innerHTML = `
      <select><option value="">Forma de pago</option><option value="04">Tarjeta de crédito</option>
        <option value="28">Tarjeta de débito</option><option value="05">Monedero electrónico</option></select>
      <button id="form_btn_accept">Continuar</button>`;
    document.getElementById("form_btn_accept").onclick = () => ir("/invoiceSelection");
  } else if (ruta === "/invoiceSelection") {
    app.innerHTML = `
      <label><input type="radio" name="m" id="method_email_radio">Correo</label>
      <label><input type="radio" name="m" id="method_pdf_radio">PDF/XML</label>
      <input name="invoice_form_email_alt_input">
      <button id="invoice_form_btn_submit">Facturar</button>`;
    document.getElementById("invoice_form_btn_submit").onclick = () => {
      window.__facturado = (window.__facturado || 0) + 1;
      if (document.getElementById("method_pdf_radio").checked) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(["<cfdi:Comprobante/>"], { type: "application/xml" }));
        a.download = "factura_prueba.xml"; document.body.appendChild(a); a.click();
      }
      app.innerHTML = "<p>Factura generada correctamente</p>";
    };
  }
}
render();
</script>
</body>
</html>
